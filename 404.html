<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sidan hittades inte | Lokomotiv Städ & Fönsterputs AB</title>

  <meta
    name="description"
    content="Sidan du söker kunde inte hittas. Gå tillbaka till Lokomotiv Städ & Fönsterputs AB:s startsida."
  >

  <meta name="robots" content="noindex, follow">

  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cardo:ital@1&family=Fira+Sans:wght@400;500;600;700;800&family=Inter:wght@400;600;800&family=Rubik:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;900&display=swap"
    rel="stylesheet"
  >

  <link
    rel="icon"
    type="image/x-icon"
    href="/bilder/favicon.ico"
  >

  <style>
    .error-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 120px 20px 60px;
    }

    .error-content {
      width: min(720px, 100%);
      text-align: center;
    }

    .error-code {
      display: block;
      margin-bottom: 8px;
      color: var(--primary);
      font-size: clamp(90px, 20vw, 180px);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.06em;
    }

    .error-content h1 {
      margin-bottom: 18px;
      color: var(--text-strong);
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.05;
    }

    .error-content p {
      max-width: 560px;
      margin: 0 auto 30px;
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    @media (max-width: 520px) {
      .error-actions .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="error-page">

    <div class="error-content">

      <span class="error-code">404</span>

      <h1>Här tog rälsen slut.</h1>

      <p>
        Sidan du försöker besöka finns inte, har flyttats
        eller så är adressen felstavad.
      </p>

      <div class="error-actions">

        <a
          href="/"
          class="btn btn-primary"
        >
          Till startsidan
        </a>

        <a
          href="/index.html#kontakt"
          class="btn btn-secondary"
        >
          Kontakta oss
        </a>

      </div>

    </div>

  </main>

</body>
</html>
