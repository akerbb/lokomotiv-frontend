<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tack för din förfrågan | Lokomotiv Städ</title>
  <meta name="description" content="Tack för din förfrågan till Lokomotiv Städ & Fönsterputs AB.">
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/x-icon" href="/bilder/favicon.ico">
  <style>
    .status-page {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    .status-card {
      width: min(680px, 100%);
      text-align: center;
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid #d7dadd;
      background: #fff;
    }
    .status-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #15803d;
      color: #fff;
      font-size: 30px;
      font-weight: 900;
    }
    .status-card h1 { margin-bottom: 14px; }
    .status-card p { margin: 0 auto 26px; max-width: 52ch; }
    .status-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main class="status-page">
    <section class="status-card" aria-labelledby="thanks-title">
      <div class="status-icon" aria-hidden="true">✓</div>
      <h1 id="thanks-title">Tack för din förfrågan!</h1>
      <p>Din förfrågan har skickats till Lokomotiv Städ &amp; Fönsterputs AB. Vi återkommer så snart vi kan.</p>
      <div class="status-actions">
        <a class="btn btn-primary" href="/">Till startsidan</a>
        <a class="btn btn-secondary" href="/#kontakt">Kontaktuppgifter</a>
      </div>
    </section>
  </main>
</body>
</html>
